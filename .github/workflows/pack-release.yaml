name: Pack and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. sdk-code-samples-v1)"
        required: true
        type: string
      release_name:
        description: "Release title (e.g. SDK code samples support)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: true

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build-packages

      - name: Pack plugin
        run: |
          cd packages/docusaurus-plugin-openapi-docs
          npm pack
          mv *.tgz ../../

      - name: Pack theme
        run: |
          cd packages/docusaurus-theme-openapi-docs
          npm pack
          mv *.tgz ../../

      - name: List artifacts
        run: ls -la *.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: "*.tgz"
